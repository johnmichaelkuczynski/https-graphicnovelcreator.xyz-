openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visitors
    description: Anonymous aggregate visit counting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /visitors:
    post:
      operationId: recordVisitor
      tags: [visitors]
      summary: Record a browser session visit
      description: Counts the supplied anonymous browser-session identifier once and returns only the shared aggregate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorSessionInput"
      responses:
        "200":
          description: Current aggregate visit count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorCount"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VisitorSessionInput:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
      required:
        - sessionId
    VisitorCount:
      type: object
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 1
      required:
        - total

